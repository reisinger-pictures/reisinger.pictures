<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review – Bildprüfung (HITL)</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;max-width:900px;margin:32px auto;padding:0 16px;background:#fafafa;color:#111}
  h1{font-size:20px;margin:0 0 6px}
  .hint{color:#666;font-size:13px;margin:0 0 16px}
  section{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:16px;margin:16px 0;display:flex;flex-direction:column;box-sizing:border-box}
  h2{font-size:14px;margin:0 0 12px;word-break:break-all}
  img{max-width:100%;max-height:calc(100vh - 320px);width:auto;height:auto;object-fit:contain;align-self:center;border-radius:8px;border:1px solid #eee;background:#fff}
  .path{font-size:11px;color:#888;word-break:break-all;margin-top:8px}
  .meta{font-size:12px;line-height:1.5;margin-top:10px;border-top:1px dashed #ddd;padding-top:10px}
  .meta b{color:#333}
  .changed{color:#c0392b}
  .same{color:#2e7d32}
  .desc{background:#f6f6f6;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px;line-height:1.45}
  .status-pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#555;margin:0 0 8px}
  .status-pill .label{max-width:100%;overflow-wrap:anywhere}
  .status-pill .dot,.comment-status .dot{width:9px;height:9px;border-radius:50%;background:#9e9e9e;flex:none}
  .status-pill[data-state="saved"] .dot,.comment-status[data-state="saved"] .dot{background:#2e7d32}
  .status-pill[data-state="unsaved"] .dot,.comment-status[data-state="unsaved"] .dot{background:#c77700;animation:pulse 1.2s ease-in-out infinite}
  .status-pill[data-state="saving"] .dot,.comment-status[data-state="saving"] .dot{width:11px;height:11px;background:transparent;border:2px solid #1565c0;border-top-color:transparent;animation:spin .8s linear infinite}
  .status-pill[data-state="error"] .dot,.comment-status[data-state="error"] .dot,.status-pill[data-state="conflict"] .dot,.comment-status[data-state="conflict"] .dot{background:#c0392b}
  .comment-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#777;margin-top:6px}
  .comment-label{display:block;margin-top:16px;font-size:13px;font-weight:600}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.45}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.status-pill .dot,.comment-status .dot{animation:none!important}}
  .err{color:#c0392b;font-size:14px}
</style>
</head>
<body>
<h1>Review – Bildprüfung (HITL)</h1>
<p class="hint" id="hint" hidden></p>
<div class="status-pill" id="save-status" data-state="idle" role="status" aria-live="polite"><span class="dot"></span><span class="label">Warte auf review.json …</span></div>
<p class="err" id="conflict-summary" role="alert" hidden></p>
<div id="review-items"></div>

<script type="module" src="./review-viewer.js"></script>
</body>
</html>
