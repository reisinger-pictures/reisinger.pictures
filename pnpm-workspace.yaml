packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  exifreader: true
  sharp: true

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.3.4'
  - '@astrojs/mdx@7.0.7'
  - astro@7.2.4

overrides:
  '@astrojs/internal-helpers>js-yaml': 4.3.1
  'astro>js-yaml': 4.3.1
  concurrently>shell-quote: 1.10.0
  'js-yaml@4': 4.3.1
  'js-yaml@>=5': 5.2.2
  brace-expansion: 5.0.9
  postcss: 8.5.23
  undici: 7.29.0
  fast-uri: 3.1.5
  nanoid: 3.3.18

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - exifreader
  - sharp
